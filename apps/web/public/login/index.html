<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwasthSetu | Patient Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/shared/styles/app.css"></head><body class="login-page"><main class="login-card"><a class="app-brand login-brand" href="/"><span class="brand-mark"><b>+</b></span><span><strong>SwasthSetu</strong><small>स्वस्थ सेतु</small></span></a><div class="login-copy"><p class="eyebrow">Patient portal</p><h1>Welcome back</h1><p>Sign in with a one-time password sent to your mobile number. New patients can register after verifying their number.</p></div><form data-login="patient"><label>Mobile number<input name="mobileNumber" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="Enter 10-digit mobile number" autocomplete="tel"></label><div id="otpStep" class="login-step" hidden><label>6-digit OTP<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Enter OTP" autocomplete="one-time-code"></label><button class="otp-link" type="button" id="changeNumber">Change mobile number</button></div><div id="registerStep" class="login-step" hidden><label>Full name<input name="fullName" data-required autocomplete="name"></label><label>Date of birth<input name="dateOfBirth" type="date" data-required></label><label>Gender<select name="gender" data-required><option value="">Select</option><option value="FEMALE">Female</option><option value="MALE">Male</option><option value="OTHER">Other</option></select></label><label>Address<input name="address" data-required autocomplete="street-address"></label><label>Blood group (optional)<input name="bloodGroup" placeholder="e.g. B+"></label><label>Emergency contact number<input name="emergencyContact" data-required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"></label></div><p class="login-message" id="loginMessage" role="status" aria-live="polite" hidden></p><button class="button primary wide" type="submit">Send OTP</button></form><p class="login-help">Hospital employee? <a href="/staff-login/">Staff Login</a></p></main><script src="/runtime-config.js"></script><script src="/assets/shared/scripts/route-login.js"></script></body></html>
